
name: iPhone IPA Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'easy.json'
      - 'normal.json'
      - 'hard.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capacitor telepítése
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/ios@7
          npm install --save-dev @capacitor/cli@7

      - name: Webes fájlok előkészítése
        run: |
          mkdir -p www
          cp index.html www/
          cp easy.json normal.json hard.json www/

      - name: Capacitor konfiguráció
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.party.reszegkviz",
            "appName": "Legyen Ön is Részeg",
            "webDir": "www"
          }
          EOF

      - name: iOS projekt létrehozása
        run: npx cap add ios

      - name: iOS projekt frissítése
        run: npx cap sync ios

      - name: iOS projekt ellenőrzése
        run: |
          test -d ios/App/App.xcodeproj
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: iPhone alkalmazás fordítása
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: IPA csomagolása
        run: |
          mkdir -p output/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app output/Payload/
          cd output
          zip -r Reszeg-Kviz-iPhone.ipa Payload

      - name: IPA mentése
        uses: actions/upload-artifact@v4
        with:
          name: Reszeg-Kviz-iPhone-IPA
          path: output/Reszeg-Kviz-iPhone.ipa

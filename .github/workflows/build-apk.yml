              private int dp(float value) {
                  return (int) (
                      value * getResources()
                          .getDisplayMetrics().density + 0.5f
                  );
              }

              private void updateSplashProgress(
                  int progress
              ) {
                  splashProgressValue = Math.max(
                      splashProgressValue,
                      Math.min(100, progress)
                  );

                  if (splashProgress != null) {
                      splashProgress.setProgress(
                          splashProgressValue
                      );
                  }
              }

              // CLASH ROYALE STÍLUSÚ BETÖLTŐCSÍK
              private class SplashProgressView extends View {

                  private final Paint paint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);

                  private final RectF barRect =
                      new RectF();

                  private int progress = 0;

                  public SplashProgressView(
                      Activity activity
                  ) {
                      super(activity);
                  }

                  public void setProgress(int value) {
                      progress = Math.max(
                          0,
                          Math.min(100, value)
                      );

                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      float width = getWidth();
                      float height = getHeight();

                      float barHeight = dp(17);

                      float top =
                          (height - barHeight) / 2f;

                      // HÁTTÉRCSÍK
                      barRect.set(
                          0,
                          top,
                          width,
                          top + barHeight
                      );

                      paint.setColor(
                          Color.rgb(35, 43, 61)
                      );

                      paint.setStyle(Paint.Style.FILL);

                      canvas.drawRoundRect(
                          barRect,
                          dp(10),
                          dp(10),
                          paint
                      );

                      // PIROS BETÖLTÉSI RÉSZ
                      float fillWidth =
                          width * progress / 100f;

                      if (fillWidth > 0) {
                          barRect.set(
                              0,
                              top,
                              fillWidth,
                              top + barHeight
                          );

                          paint.setColor(
                              Color.rgb(220, 38, 38)
                          );

                          canvas.drawRoundRect(
                              barRect,
                              dp(10),
                              dp(10),
                              paint
                          );
                      }

                      // SZÁZALÉK A CSÍK KÖZEPÉN
                      paint.setColor(Color.WHITE);

                      paint.setTextSize(dp(12));

                      paint.setTypeface(
                          Typeface.create(
                              "sans-serif",
                              Typeface.BOLD
                          )
                      );

                      paint.setTextAlign(
                          Paint.Align.CENTER
                      );

                      Paint.FontMetrics metrics =
                          paint.getFontMetrics();

                      float textY =
                          height / 2f -
                          (metrics.ascent +
                           metrics.descent) / 2f;

                      canvas.drawText(
                          progress + "%",
                          width / 2f,
                          textY,
                          paint
                      );
                  }
              }

              // TELEPÍTETT VERZIÓ LEKÉRÉSE
              private int getInstalledVersionCode() {
                  try {
                      PackageInfo info =
                          getPackageManager()
                              .getPackageInfo(
                                  getPackageName(),
                                  0
                              );

                      if (android.os.Build.VERSION.SDK_INT >= 28) {
                          return (int) info.getLongVersionCode();
                      }

                      return info.versionCode;

                  } catch (Exception e) {
                      return 0;
                  }
              }

              // INTERNETKAPCSOLAT ELLENŐRZÉSE
              private boolean isInternetAvailable() {
                  try {
                      ConnectivityManager connectivityManager =
                          (ConnectivityManager)
                              getSystemService(
                                  CONNECTIVITY_SERVICE
                              );

                      if (connectivityManager == null) {
                          return false;
                      }

                      Network network =
                          connectivityManager
                              .getActiveNetwork();

                      if (network == null) {
                          return false;
                      }

                      NetworkCapabilities capabilities =
                          connectivityManager
                              .getNetworkCapabilities(network);

                      return capabilities != null &&
                          capabilities.hasCapability(
                              NetworkCapabilities
                                  .NET_CAPABILITY_INTERNET
                          ) &&
                          capabilities.hasCapability(
                              NetworkCapabilities
                                  .NET_CAPABILITY_VALIDATED
                          );

                  } catch (Exception e) {
                      return false;
                  }
              }

              // SZERVERES APK VERZIÓELLENŐRZÉS
              private void checkVersion() {
                  if (
                      checkingVersion ||
                      checkingContent ||
                      gameLoading ||
                      activityClosed()
                  ) {
                      return;
                  }

                  checkingVersion = true;

                  setSplashStatus(
                      "Connecting to the server"
                  );

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {
                          URL url = new URL(VERSION_URL);

                          connection =
                              (HttpURLConnection)
                                  url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);
                          connection.setUseCaches(false);
                          connection.setInstanceFollowRedirects(false);

                          connection.setRequestProperty(
                              "Cache-Control", "no-cache"
                          );

                          int responseCode =
                              connection.getResponseCode();

                          if (responseCode != 200) {
                              throw new Exception(
                                  "Szerverhiba: " + responseCode
                              );
                          }

                          StringBuilder response =
                              new StringBuilder();

                          try (
                              InputStream input =
                                  connection.getInputStream();

                              BufferedReader reader =
                                  new BufferedReader(
                                      new InputStreamReader(
                                          input,
                                          "UTF-8"
                                      )
                                  )
                          ) {
                              String line;

                              while (
                                  (line = reader.readLine()) != null
                              ) {
                                  response.append(line);

                                  if (response.length() > 65536) {
                                      throw new Exception(
                                          "Túl nagy verzióválasz."
                                      );
                                  }
                              }
                          }

                          JSONObject json =
                              new JSONObject(
                                  response.toString()
                              );

                          if (!json.optBoolean(
                              "success", false
                          )) {
                              throw new Exception(
                                  "Érvénytelen verzióadat."
                              );
                          }

                          latestVersionCode =
                              json.getInt("versionCode");

                          latestVersionName =
                              json.optString(
                                  "versionName", ""
                              );

                          minimumVersionCode =
                              json.getInt(
                                  "minSupportedVersionCode"
                              );

                          downloadUrl =
                              json.optString(
                                  "downloadUrl", ""
                              );

                          int installedVersion =
                              getInstalledVersionCode();

                          handler.post(() -> {
                              checkingVersion = false;

                              if (activityClosed()) return;

                              setSplashStatus("Connecting");

                              if (installedVersion <
                                  minimumVersionCode) {

                                  showUpdateRequiredDialog();

                              } else {
                                  checkLiveUpdate();
                              }
                          });

                      } catch (Exception e) {
                          handler.post(() -> {
                              checkingVersion = false;

                              if (activityClosed()) return;

                              if (isInternetAvailable()) {
                                  loadGame();
                              } else {
                                  showConnectionErrorDialog();
                              }
                          });

                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              // LIVE UPDATE ELLENŐRZÉSE
              private void checkLiveUpdate() {
                  if (
                      checkingContent ||
                      gameLoading ||
                      activityClosed()
                  ) {
                      return;
                  }

                  checkingContent = true;

                  new Thread(() -> {
                      try {
                          final int[] lastProgress = {-1};

                          boolean updated =
                              liveUpdateManager.checkForUpdate(
                                  new LiveUpdateManager.Listener() {

                                      @Override
                                      public void onUpdateStarted() {
                                          handler.post(() -> {
                                              beginLiveUpdate();
                                          });
                                      }

                                      @Override
                                      public void onProgress(
                                          int progress
                                      ) {
                                          if (lastProgress[0] ==
                                              progress) {
                                              return;
                                          }

                                          lastProgress[0] =
                                              progress;

                                          handler.post(() -> {
                                              setLiveUpdateProgress(
                                                  progress
                                              );
                                          });
                                      }
                                  }
                              );

                          handler.post(() -> {
                              finishLiveUpdate(updated);
                          });

                      } catch (Exception e) {
                          android.util.Log.w(
                              "LiveUpdate",
                              "A frissítés sikertelen. " +
                              "Korábbi tartalom használata.",
                              e
                          );

                          handler.post(() -> {
                              if (activityClosed()) return;

                              if (updatingContent) {
                                  Toast.makeText(
                                      this,
                                      "A frissítés nem sikerült. " +
                                      "A korábbi verzió indul.",
                                      Toast.LENGTH_LONG
                                  ).show();
                              }

                              finishLiveUpdate(false);
                          });
                      }

                  }).start();
              }

              // KÖTELEZŐ APK FRISSÍTÉSI KÉPERNYŐ
              private void showUpdateRequiredDialog() {
                  if (
                      updateDialogShowing ||
                      activityClosed()
                  ) {
                      return;
                  }

                  updateDialogShowing = true;

                  AlertDialog.Builder builder =
                      new AlertDialog.Builder(this);

                  builder.setTitle(
                      "🍻 Frissítés szükséges!"
                  );

                  builder.setMessage(
                      "A játék használatához frissítened kell az alkalmazást.\n\n" +
                      "Telepített verzió: " +
                      getInstalledVersionCode() +
                      "\nElérhető verzió: " +
                      latestVersionName +
                      "\n\nA frissítés után folytathatod a játékot."
                  );

                  if (downloadUrl != null &&
                      !downloadUrl.trim().isEmpty()) {

                      builder.setPositiveButton(
                          "FRISSÍTÉS",
                          (dialog, which) -> openDownload()
                      );

                  } else {
                      builder.setPositiveButton(
                          "ÚJRAELLENŐRZÉS",
                          (dialog, which) -> {
                              updateDialogShowing = false;
                              checkVersion();
                          }
                      );
                  }

                  builder.setNegativeButton(
                      "KILÉPÉS",
                      (dialog, which) -> finish()
                  );

                  builder.setCancelable(false);

                  AlertDialog dialog = builder.create();

                  dialog.setCanceledOnTouchOutside(false);

                  dialog.setOnDismissListener(
                      d -> updateDialogShowing = false
                  );

                  dialog.show();
              }

              // APK LETÖLTÉSI OLDAL MEGNYITÁSA
              private void openDownload() {
                  try {
                      Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse(downloadUrl)
                      );

                      waitingForApkUpdate = true;

                      startActivity(intent);

                  } catch (Exception e) {
                      waitingForApkUpdate = false;

                      Toast.makeText(
                          this,
                          "Nem sikerült megnyitni a letöltést.",
                          Toast.LENGTH_LONG
                      ).show();

                      handler.postDelayed(
                          () -> showUpdateRequiredDialog(),
                          300
                      );
                  }
              }



name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'easy.json'
      - 'normal.json'
      - 'hard.json'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/party/reszegkviz
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-nodpi

          cp index.html app/src/main/assets/index.html
          cp easy.json app/src/main/assets/easy.json
          cp normal.json app/src/main/assets/normal.json
          cp hard.json app/src/main/assets/hard.json

          # SAJÁT ALKALMAZÁS IKON
          cp icon-512.png app/src/main/res/mipmap-nodpi/ic_launcher.png

          echo "android.useAndroidX=true" >> gradle.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReszegKviz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.party.reszegkviz'
              compileSdk 35

              signingConfigs {
                  release {
                      storeFile file("release-key.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'com.party.reszegkviz'
                  minSdk 23
                  targetSdk 35
                  versionCode 500
                  versionName '5.0'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-splashscreen:1.0.1'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#080D19</item>
                  <item name="android:colorAccent">#FBBF24</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#080D19</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="Theme.App.Starting" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#080D19</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_cup</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#080D19</item>
              </style>
          </resources>
          EOF

          # AURORA GLASS HÁTTÉR
          cat > app/src/main/res/drawable/splash_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="#080D19"
                  android:centerColor="#101B32"
                  android:endColor="#21152F" />
          </shape>
          EOF

          # KIZÁRÓLAG EGY ÜRES PIROS POHÁR
          cat > app/src/main/res/drawable/splash_cup.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#B91C1C"
                  android:pathData="M27,22 L81,22 L74,80 Q73,88 64,88 L44,88 Q35,88 34,80 Z" />

              <path
                  android:fillColor="#DC2626"
                  android:pathData="M27,22 L81,22 L80,30 L28,30 Z" />

              <path
                  android:fillColor="#EF4444"
                  android:pathData="M34,31 L43,31 L47,78 L39,78 Z" />

              <path
                  android:fillColor="#991B1B"
                  android:pathData="M68,31 L76,31 L70,80 L63,80 Z" />

          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:theme="@style/Theme.App.Starting"
                  android:label="Legyen Ön is Részeg"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/party/reszegkviz/MainActivity.java <<'EOF'
          package com.party.reszegkviz;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.AnimatorSet;
          import android.animation.ObjectAnimator;
          import android.view.animation.DecelerateInterpolator;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.widget.Toast;
          import android.widget.TextView;
          import android.widget.Button;

          import androidx.core.splashscreen.SplashScreen;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {

              private static final String VERSION_URL =
                  "https://legyen-on-is-reszeg.onrender.com/api/version";

              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              private volatile boolean webViewReady = false;
              private boolean checkingVersion = false;
              private boolean updateDialogShowing = false;
              private boolean gameLoading = false;

              private boolean splashLoadingComplete = false;
              private boolean splashFinishScheduled = false;

              private String downloadUrl = "";
              private int latestVersionCode = 0;
              private int minimumVersionCode = 0;
              private String latestVersionName = "";

              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private FrameLayout splashLayout;
              private SplashProgressView splashProgress;
              private TextView splashStatusView;
              private String splashStatus = "Connecting to the server";
              private int splashDots = 0;
              private int splashProgressValue = 0;
              private WebView gameWebView;

              // ANIMÁLT HÁROM PONT
              private final Runnable splashStatusRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (splashStatusView != null) {
                          splashDots = (splashDots % 3) + 1;

                          StringBuilder dots = new StringBuilder();

                          for (int i = 0; i < splashDots; i++) {
                              dots.append(".");
                          }

                          splashStatusView.setText(
                              splashStatus + dots.toString()
                          );

                          handler.postDelayed(this, 450);
                      }
                  }
              };

              private void setSplashStatus(String status) {
                  splashStatus = status;
                  splashDots = 0;

                  if (splashStatusView != null) {
                      splashStatusView.setText(status + "...");
                  }

                  handler.removeCallbacks(splashStatusRunnable);
                  handler.postDelayed(splashStatusRunnable, 450);
              }

              // BETÖLTÉSI ANIMÁCIÓ
              // 0 -> 79: nagyon gyors
              // 79 -> 96: gyors
              // 96 -> 99: Render-várakozáskor lassú
              // 99 -> 100: csak a játék betöltése után

              private final Runnable splashProgressRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (splashProgress == null || isFinishing()) {
                          return;
                      }

                      int delay;

                      if (splashProgressValue < 79) {
                          updateSplashProgress(
                              Math.min(79, splashProgressValue + 7)
                          );

                          delay = 12;

                      } else if (splashProgressValue < 96) {
                          updateSplashProgress(
                              splashProgressValue + 1
                          );

                          delay = 22;

                      } else if (splashProgressValue < 99) {
                          updateSplashProgress(
                              splashProgressValue + 1
                          );

                          delay = checkingVersion ? 1200 : 350;

                      } else if (splashLoadingComplete &&
                                 splashProgressValue < 100) {

                          updateSplashProgress(100);

                          if (!splashFinishScheduled) {
                              splashFinishScheduled = true;

                              handler.postDelayed(() -> {
                                  if (!isFinishing() &&
                                      gameWebView != null) {
                                      showGameWithTransition();
                                  }
                              }, 300);
                          }

                          return;

                      } else {
                          delay = 500;
                      }

                      handler.postDelayed(this, delay);
                  }
              };

              // FINOM ÁTMENET A BETÖLTŐKÉPERNYŐRŐL A JÁTÉKRA
              private void showGameWithTransition() {
                  if (isFinishing() ||
                      gameWebView == null ||
                      splashLayout == null) {
                      return;
                  }

                  gameWebView.setAlpha(0f);
                  gameWebView.setScaleX(0.985f);
                  gameWebView.setScaleY(0.985f);

                  setContentView(gameWebView);
                  enableFullscreen();

                  View splash = splashLayout;

                  ObjectAnimator gameFade =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.ALPHA,
                          0f,
                          1f
                      );

                  ObjectAnimator gameScaleX =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.SCALE_X,
                          0.985f,
                          1f
                      );

                  ObjectAnimator gameScaleY =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.SCALE_Y,
                          0.985f,
                          1f
                      );

                  ObjectAnimator splashFade =
                      ObjectAnimator.ofFloat(
                          splash,
                          View.ALPHA,
                          1f,
                          0f
                      );

                  AnimatorSet transition = new AnimatorSet();

                  transition.playTogether(
                      gameFade,
                      gameScaleX,
                      gameScaleY,
                      splashFade
                  );

                  transition.setDuration(450);
                  transition.setInterpolator(
                      new DecelerateInterpolator()
                  );

                  transition.addListener(
                      new AnimatorListenerAdapter() {
                          @Override
                          public void onAnimationEnd(Animator animation) {
                              splash.setAlpha(1f);
                              splashLayout = null;
                          }
                      }
                  );

                  transition.start();
              }

              // TELJES KÉPERNYŐS MÓD
              private void enableFullscreen() {
                  Window window = getWindow();

                  window.setStatusBarColor(Color.rgb(8, 13, 25));
                  window.setNavigationBarColor(Color.rgb(8, 13, 25));

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController controller =
                          window.getInsetsController();

                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                              WindowInsetsController
                                  .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );

                          controller.hide(
                              WindowInsets.Type.statusBars() |
                              WindowInsets.Type.navigationBars()
                          );
                      }
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);

                  super.onCreate(savedInstanceState);

                  enableFullscreen();
                  showSplashScreen();
                  checkVersion();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);

                  if (hasFocus) {
                      enableFullscreen();
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);

                  if (gameWebView != null) {
                      gameWebView.stopLoading();
                      gameWebView.destroy();
                      gameWebView = null;
                  }

                  super.onDestroy();
              }

              // AURORA GLASS BETÖLTŐKÉPERNYŐ
              private void showSplashScreen() {
                  splashLayout = new FrameLayout(this);

                  splashLayout.setBackgroundResource(
                      R.drawable.splash_background
                  );

                  // KÖZÉPEN KIZÁRÓLAG A PIROS POHÁR
                  ImageView cup = new ImageView(this);
                  cup.setImageResource(R.drawable.splash_cup);
                  cup.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  FrameLayout.LayoutParams cupParams =
                      new FrameLayout.LayoutParams(
                          dp(108),
                          dp(108),
                          Gravity.CENTER
                      );

                  splashLayout.addView(cup, cupParams);

                  // BETÖLTÉSI ÁLLAPOT A CSÍK FELETT
                  splashStatusView = new TextView(this);
                  splashStatusView.setTextColor(Color.rgb(226, 232, 240));
                  splashStatusView.setTextSize(14);
                  splashStatusView.setTypeface(
                      Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  );
                  splashStatusView.setGravity(Gravity.CENTER);
                  splashStatusView.setSingleLine(true);

                  FrameLayout.LayoutParams statusParams =
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          dp(30),
                          Gravity.BOTTOM
                      );

                  statusParams.leftMargin = dp(24);
                  statusParams.rightMargin = dp(24);
                  statusParams.bottomMargin = dp(60);

                  splashLayout.addView(
                      splashStatusView,
                      statusParams
                  );

                  setSplashStatus("Connecting to the server");

                  // BETÖLTŐCSÍK
                  splashProgress = new SplashProgressView(this);

                  FrameLayout.LayoutParams progressParams =
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          dp(48),
                          Gravity.BOTTOM
                      );

                  progressParams.leftMargin = dp(24);
                  progressParams.rightMargin = dp(24);
                  progressParams.bottomMargin = dp(12);

                  splashLayout.addView(
                      splashProgress,
                      progressParams
                  );

                  setContentView(splashLayout);
                  enableFullscreen();

                  // INDULÁS 0%-RÓL
                  splashProgressValue = 0;
                  splashLoadingComplete = false;
                  splashFinishScheduled = false;

                  updateSplashProgress(0);

                  handler.removeCallbacks(splashProgressRunnable);
                  handler.post(splashProgressRunnable);
              }

              private int dp(float value) {
                  return (int) (
                      value * getResources()
                          .getDisplayMetrics().density + 0.5f
                  );
              }

              private void updateSplashProgress(int progress) {
                  splashProgressValue = Math.max(
                      splashProgressValue,
                      Math.min(100, progress)
                  );

                  if (splashProgress != null) {
                      splashProgress.setProgress(splashProgressValue);
                  }
              }

              // CLASH ROYALE STÍLUSÚ BETÖLTŐCSÍK
              private class SplashProgressView extends View {

                  private final Paint paint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);

                  private final RectF barRect = new RectF();
                  private int progress = 0;

                  public SplashProgressView(Activity activity) {
                      super(activity);
                  }

                  public void setProgress(int value) {
                      progress = Math.max(0, Math.min(100, value));
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      float width = getWidth();
                      float height = getHeight();

                      float barHeight = dp(17);
                      float top = (height - barHeight) / 2f;

                      // HÁTTÉRCSÍK
                      barRect.set(
                          0,
                          top,
                          width,
                          top + barHeight
                      );

                      paint.setColor(Color.rgb(35, 43, 61));
                      paint.setStyle(Paint.Style.FILL);

                      canvas.drawRoundRect(
                          barRect,
                          dp(10),
                          dp(10),
                          paint
                      );

                      // PIROS BETÖLTÉSI RÉSZ
                      float fillWidth =
                          width * progress / 100f;

                      if (fillWidth > 0) {
                          barRect.set(
                              0,
                              top,
                              fillWidth,
                              top + barHeight
                          );

                          paint.setColor(Color.rgb(220, 38, 38));

                          canvas.drawRoundRect(
                              barRect,
                              dp(10),
                              dp(10),
                              paint
                          );
                      }

                      // SZÁZALÉK A CSÍK KÖZEPÉN
                      paint.setColor(Color.WHITE);
                      paint.setTextSize(dp(12));
                      paint.setTypeface(
                          Typeface.create(
                              "sans-serif",
                              Typeface.BOLD
                          )
                      );
                      paint.setTextAlign(Paint.Align.CENTER);

                      Paint.FontMetrics metrics =
                          paint.getFontMetrics();

                      float textY =
                          height / 2f -
                          (metrics.ascent + metrics.descent) / 2f;

                      canvas.drawText(
                          progress + "%",
                          width / 2f,
                          textY,
                          paint
                      );
                  }
              }

              // TELEPÍTETT VERZIÓ LEKÉRÉSE
              private int getInstalledVersionCode() {
                  try {
                      PackageInfo info = getPackageManager()
                          .getPackageInfo(getPackageName(), 0);

                      if (android.os.Build.VERSION.SDK_INT >= 28) {
                          return (int) info.getLongVersionCode();
                      }

                      return info.versionCode;

                  } catch (Exception e) {
                      return 0;
                  }
              }

              // INTERNETKAPCSOLAT ELLENŐRZÉSE
              private boolean isInternetAvailable() {
                  try {
                      ConnectivityManager connectivityManager =
                          (ConnectivityManager) getSystemService(
                              CONNECTIVITY_SERVICE
                          );

                      if (connectivityManager == null) {
                          return false;
                      }

                      Network network =
                          connectivityManager.getActiveNetwork();

                      if (network == null) {
                          return false;
                      }

                      NetworkCapabilities capabilities =
                          connectivityManager.getNetworkCapabilities(
                              network
                          );

                      return capabilities != null &&
                          capabilities.hasCapability(
                              NetworkCapabilities.NET_CAPABILITY_INTERNET
                          ) &&
                          capabilities.hasCapability(
                              NetworkCapabilities.NET_CAPABILITY_VALIDATED
                          );

                  } catch (Exception e) {
                      return false;
                  }
              }

              // SZERVERES VERZIÓELLENŐRZÉS
              private void checkVersion() {
                  if (checkingVersion || isFinishing()) {
                      return;
                  }

                  checkingVersion = true;
                  setSplashStatus("Connecting to the server");

                  new Thread(() -> {
                      HttpURLConnection connection = null;

                      try {
                          URL url = new URL(VERSION_URL);

                          connection = (HttpURLConnection)
                              url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);
                          connection.setUseCaches(false);
                          connection.setRequestProperty(
                              "Cache-Control", "no-cache"
                          );

                          int responseCode =
                              connection.getResponseCode();

                          if (responseCode != 200) {
                              throw new Exception(
                                  "Szerverhiba: " + responseCode
                              );
                          }

                          InputStream input =
                              connection.getInputStream();

                          BufferedReader reader =
                              new BufferedReader(
                                  new InputStreamReader(input, "UTF-8")
                              );

                          StringBuilder response =
                              new StringBuilder();

                          String line;

                          while ((line = reader.readLine()) != null) {
                              response.append(line);
                          }

                          reader.close();

                          JSONObject json =
                              new JSONObject(response.toString());

                          if (!json.optBoolean("success", false)) {
                              throw new Exception(
                                  "Érvénytelen verzióadat."
                              );
                          }

                          latestVersionCode =
                              json.getInt("versionCode");

                          latestVersionName =
                              json.optString("versionName", "");

                          minimumVersionCode =
                              json.getInt("minSupportedVersionCode");

                          downloadUrl =
                              json.optString("downloadUrl", "");

                          int installedVersion =
                              getInstalledVersionCode();

                          handler.post(() -> {
                              checkingVersion = false;

                              if (isFinishing()) return;

                              setSplashStatus("Connecting");

                              if (installedVersion <
                                  minimumVersionCode) {

                                  showUpdateRequiredDialog();
                              } else {
                                  loadGame();
                              }
                          });

                      } catch (Exception e) {
                          handler.post(() -> {
                              checkingVersion = false;

                              if (!isFinishing()) {
                                  if (isInternetAvailable()) {
                                      loadGame();
                                  } else {
                                      showConnectionErrorDialog();
                                  }
                              }
                          });

                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              // KÖTELEZŐ FRISSÍTÉSI KÉPERNYŐ
              private void showUpdateRequiredDialog() {
                  webViewReady = true;

                  if (updateDialogShowing || isFinishing()) {
                      return;
                  }

                  updateDialogShowing = true;

                  AlertDialog.Builder builder =
                      new AlertDialog.Builder(this);

                  builder.setTitle("🍻 Frissítés szükséges!");

                  builder.setMessage(
                      "A játék használatához frissítened kell az alkalmazást.\n\n" +
                      "Telepített verzió: " +
                      getInstalledVersionCode() +
                      "\nElérhető verzió: " +
                      latestVersionName +
                      "\n\nA frissítés után folytathatod a játékot."
                  );

                  if (downloadUrl != null &&
                      !downloadUrl.trim().isEmpty()) {

                      builder.setPositiveButton(
                          "FRISSÍTÉS",
                          (dialog, which) -> openDownload()
                      );

                  } else {
                      builder.setPositiveButton(
                          "ÚJRAELLENŐRZÉS",
                          (dialog, which) -> {
                              updateDialogShowing = false;
                              checkVersion();
                          }
                      );
                  }

                  builder.setNegativeButton(
                      "KILÉPÉS",
                      (dialog, which) -> finish()
                  );

                  builder.setCancelable(false);

                  AlertDialog dialog = builder.create();

                  dialog.setCanceledOnTouchOutside(false);

                  dialog.setOnDismissListener(
                      d -> updateDialogShowing = false
                  );

                  dialog.show();
              }

              // APK LETÖLTÉSI OLDAL MEGNYITÁSA
              private void openDownload() {
                  try {
                      Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse(downloadUrl)
                      );

                      startActivity(intent);

                  } catch (Exception e) {
                      Toast.makeText(
                          this,
                          "Nem sikerült megnyitni a letöltést.",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              // SÖTÉT, LEKEREKÍTETT KAPCSOLÓDÁSI HIBAABLAK
              private void showConnectionErrorDialog() {
                  if (isFinishing()) return;

                  AlertDialog dialog =
                      new AlertDialog.Builder(this)
                          .setTitle("Kapcsolódási hiba")
                          .setMessage(
                              "Nem sikerült ellenőrizni az alkalmazás verzióját.\n\n" +
                              "Ellenőrizd az internetkapcsolatot, vagy indítsd el a játékot offline módban."
                          )
                          .setPositiveButton(
                              "OFFLINE JÁTÉK",
                              (dialogInterface, which) -> loadGame()
                          )
                          .setNeutralButton(
                              "ÚJRA",
                              (dialogInterface, which) -> checkVersion()
                          )
                          .setNegativeButton(
                              "KILÉPÉS",
                              (dialogInterface, which) -> finish()
                          )
                          .setCancelable(false)
                          .create();

                  dialog.setCanceledOnTouchOutside(false);
                  dialog.show();

                  // SÖTÉT HÁTTÉR ÉS LEKEREKÍTETT SAROK
                  GradientDrawable background =
                      new GradientDrawable();

                  background.setColor(Color.rgb(16, 32, 31));
                  background.setCornerRadius(dp(28));

                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawable(background);
                  }

                  // VILÁGOS SZÖVEG
                  int titleId = getResources().getIdentifier(
                      "alertTitle",
                      "id",
                      "android"
                  );

                  TextView title = titleId != 0
                      ? dialog.findViewById(titleId)
                      : null;

                  TextView message =
                      dialog.findViewById(android.R.id.message);

                  if (title != null) {
                      title.setTextColor(Color.rgb(240, 253, 250));
                  }

                  if (message != null) {
                      message.setTextColor(Color.rgb(226, 245, 242));
                  }

                  // TÜRKIZ GOMBOK
                  int turquoise = Color.rgb(45, 212, 191);

                  Button positive =
                      dialog.getButton(AlertDialog.BUTTON_POSITIVE);

                  Button neutral =
                      dialog.getButton(AlertDialog.BUTTON_NEUTRAL);

                  Button negative =
                      dialog.getButton(AlertDialog.BUTTON_NEGATIVE);

                  if (positive != null) {
                      positive.setTextColor(turquoise);
                  }

                  if (neutral != null) {
                      neutral.setTextColor(turquoise);
                  }

                  if (negative != null) {
                      negative.setTextColor(turquoise);
                  }
              }

              // JÁTÉK BETÖLTÉSE – HELYI ASSETS ÉS OFFLINE JSON
              private void loadGame() {
                  if (isFinishing() || gameLoading) return;

                  gameLoading = true;

                  try {
                      gameWebView = new WebView(this);

                      WebSettings settings = gameWebView.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                              .addPathHandler(
                                  "/assets/",
                                  new WebViewAssetLoader.AssetsPathHandler(this)
                              )
                              .build();

                      gameWebView.setWebViewClient(
                          new WebViewClientCompat() {

                              @Override
                              public WebResourceResponse shouldInterceptRequest(
                                  WebView view,
                                  WebResourceRequest request
                              ) {
                                  return assetLoader.shouldInterceptRequest(
                                      request.getUrl()
                                  );
                              }

                              @Override
                              public void onPageFinished(
                                  WebView view,
                                  String url
                              ) {
                                  super.onPageFinished(view, url);

                                  if (webViewReady || isFinishing()) {
                                      return;
                                  }

                                  // A JÁTÉK TÉNYLEGESEN BETÖLTÖTT
                                  webViewReady = true;
                                  splashLoadingComplete = true;

                                  // A BETÖLTŐCSÍK EZUTÁN ÉRI EL A 100%-OT
                                  handler.removeCallbacks(
                                      splashProgressRunnable
                                  );

                                  handler.post(splashProgressRunnable);
                              }
                          }
                      );

                      gameWebView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public void onProgressChanged(
                                  WebView view,
                                  int newProgress
                              ) {
                                  // A BETÖLTÉSI SZÁZALÉKOT A SAJÁT
                                  // ANIMÁCIÓ KEZELI.
                                  // A 100%-OT AZ onPageFinished ÁLLÍTJA BE.
                              }

                              @Override
                              public boolean onShowFileChooser(
                                  WebView webView,
                                  ValueCallback<Uri[]> callback,
                                  FileChooserParams params
                              ) {

                                  if (filePathCallback != null) {
                                      filePathCallback.onReceiveValue(null);
                                  }

                                  filePathCallback = callback;

                                  try {
                                      Intent intent = params.createIntent();

                                      startActivityForResult(
                                          intent,
                                          FILE_CHOOSER_REQUEST_CODE
                                      );

                                  } catch (Exception e) {
                                      filePathCallback.onReceiveValue(null);
                                      filePathCallback = null;
                                      return false;
                                  }

                                  return true;
                              }
                          }
                      );

                      gameWebView.loadUrl(
                          "https://appassets.androidplatform.net/assets/index.html"
                      );

                  } catch (Exception e) {
                      gameLoading = false;

                      Toast.makeText(
                          this,
                          "A játék betöltése nem sikerült.",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback == null) return;

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }
          }
          EOF

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.p12

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reszeg-Kviz-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

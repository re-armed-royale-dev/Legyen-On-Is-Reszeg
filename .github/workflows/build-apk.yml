name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'easy.json'
      - 'normal.json'
      - 'hard.json'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/party/reszegkviz
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-nodpi

          cp index.html app/src/main/assets/index.html
          cp easy.json app/src/main/assets/easy.json
          cp normal.json app/src/main/assets/normal.json
          cp hard.json app/src/main/assets/hard.json

          # TAILWIND CSS MOTOR HELYI CSOMAGOLÁSA
          # Így internet nélkül is ugyanaz a felület és elrendezés jelenik meg.
          curl --fail --location --retry 3 --retry-delay 2 \
            https://cdn.tailwindcss.com \
            --output app/src/main/assets/tailwindcss.js
          test -s app/src/main/assets/tailwindcss.js

          # SAJÁT ALKALMAZÁS IKON
          cp icon-512.png app/src/main/res/mipmap-nodpi/ic_launcher.png

          echo "android.useAndroidX=true" >> gradle.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReszegKviz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.party.reszegkviz'
              compileSdk 35

              signingConfigs {
                  release {
                      storeFile file("release-key.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'com.party.reszegkviz'
                  minSdk 23
                  targetSdk 35
                  versionCode 510
                  versionName '5.1'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-splashscreen:1.0.1'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#080D19</item>
                  <item name="android:colorAccent">#FBBF24</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#080D19</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="Theme.App.Starting" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#080D19</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_cup</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#080D19</item>
              </style>
          </resources>
          EOF

          # AURORA GLASS HÁTTÉR
          cat > app/src/main/res/drawable/splash_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="#080D19"
                  android:centerColor="#101B32"
                  android:endColor="#21152F" />
          </shape>
          EOF

          # KIZÁRÓLAG EGY ÜRES PIROS POHÁR
          cat > app/src/main/res/drawable/splash_cup.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#B91C1C"
                  android:pathData="M27,22 L81,22 L74,80 Q73,88 64,88 L44,88 Q35,88 34,80 Z" />

              <path
                  android:fillColor="#DC2626"
                  android:pathData="M27,22 L81,22 L80,30 L28,30 Z" />

              <path
                  android:fillColor="#EF4444"
                  android:pathData="M34,31 L43,31 L47,78 L39,78 Z" />

              <path
                  android:fillColor="#991B1B"
                  android:pathData="M68,31 L76,31 L70,80 L63,80 Z" />

          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:theme="@style/Theme.App.Starting"
                  android:label="Legyen Ön is Részeg"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          # LIVE UPDATE RENDSZER
          cat > app/src/main/java/com/party/reszegkviz/LiveUpdateManager.java <<'EOF'
          package com.party.reszegkviz;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.net.URL;
          import java.net.HttpURLConnection;
          import java.security.MessageDigest;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          public class LiveUpdateManager {

              private static final String SERVER =
                  "https://legyen-on-is-reszeg.onrender.com";

              private static final String MANIFEST_URL =
                  SERVER + "/api/content/version";

              private static final String DOWNLOAD_URL =
                  SERVER + "/api/content/download/";

              private static final String[] CONTENT_FILES = {
                  "index.html",
                  "easy.json",
                  "normal.json",
                  "hard.json"
              };

              private static final long MAX_FILE_SIZE =
                  25L * 1024L * 1024L;

              private static final long MAX_TOTAL_SIZE =
                  80L * 1024L * 1024L;

              private final Context context;
              private final File root;
              private final SharedPreferences preferences;

              public interface Listener {
                  void onUpdateStarted();
                  void onProgress(int progress);
              }

              private static class ContentFile {
                  String name;
                  long size;
                  String sha256;
              }

              public LiveUpdateManager(
                  Context context,
                  int installedVersion
              ) {
                  this.context = context.getApplicationContext();

                  root = new File(
                      context.getFilesDir(),
                      "live-content-" + installedVersion
                  );

                  preferences = context.getSharedPreferences(
                      "live_update_" + installedVersion,
                      Context.MODE_PRIVATE
                  );
              }

              private boolean isAllowedFile(String name) {
                  for (String allowed : CONTENT_FILES) {
                      if (allowed.equals(name)) {
                          return true;
                      }
                  }

                  return false;
              }

              private HttpURLConnection openConnection(
                  String address
              ) throws Exception {

                  URL url = new URL(address);

                  if (!"https".equals(url.getProtocol()) ||
                      !"legyen-on-is-reszeg.onrender.com"
                          .equals(url.getHost())) {

                      throw new IOException(
                          "Nem engedélyezett szerver."
                      );
                  }

                  HttpURLConnection connection =
                      (HttpURLConnection) url.openConnection();

                  connection.setRequestMethod("GET");
                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(20000);
                  connection.setUseCaches(false);
                  connection.setInstanceFollowRedirects(false);

                  connection.setRequestProperty(
                      "Cache-Control", "no-cache"
                  );

                  connection.setRequestProperty(
                      "Accept-Encoding", "identity"
                  );

                  return connection;
              }

              private String toHex(byte[] bytes) {
                  StringBuilder result = new StringBuilder();

                  for (byte value : bytes) {
                      result.append(
                          String.format(
                              java.util.Locale.US,
                              "%02x",
                              value & 0xff
                          )
                      );
                  }

                  return result.toString();
              }

              private String calculateHash(
                  InputStream input
              ) throws Exception {

                  MessageDigest digest =
                      MessageDigest.getInstance("SHA-256");

                  byte[] buffer = new byte[16384];
                  int count;

                  while ((count = input.read(buffer)) != -1) {
                      digest.update(buffer, 0, count);
                  }

                  return toHex(digest.digest());
              }

              private JSONObject readManifest() throws Exception {

                  HttpURLConnection connection =
                      openConnection(MANIFEST_URL);

                  try {
                      if (connection.getResponseCode() != 200) {
                          throw new IOException(
                              "Live Update szerverhiba."
                          );
                      }

                      try (
                          InputStream input =
                              connection.getInputStream();

                          ByteArrayOutputStream output =
                              new ByteArrayOutputStream()
                      ) {
                          byte[] buffer = new byte[4096];
                          int count;

                          while ((count = input.read(buffer)) != -1) {
                              output.write(buffer, 0, count);

                              if (output.size() > 65536) {
                                  throw new IOException(
                                      "Túl nagy manifest."
                                  );
                              }
                          }

                          JSONObject manifest = new JSONObject(
                              output.toString("UTF-8")
                          );

                          if (!manifest.optBoolean("success", false)) {
                              throw new IOException(
                                  "Érvénytelen manifest."
                              );
                          }

                          return manifest;
                      }

                  } finally {
                      connection.disconnect();
                  }
              }

              private Map<String, ContentFile> parseFiles(
                  JSONObject manifest
              ) throws Exception {

                  JSONArray array = manifest.getJSONArray("files");

                  if (array.length() != CONTENT_FILES.length) {
                      throw new IOException(
                          "Hiányos tartalomlista."
                      );
                  }

                  Map<String, ContentFile> files =
                      new HashMap<>();

                  long totalSize = 0;

                  for (int i = 0; i < array.length(); i++) {
                      JSONObject item = array.getJSONObject(i);

                      ContentFile file = new ContentFile();

                      file.name = item.getString("name");
                      file.size = item.getLong("size");
                      file.sha256 = item.getString("sha256");

                      if (
                          !isAllowedFile(file.name) ||
                          files.containsKey(file.name) ||
                          file.size <= 0 ||
                          file.size > MAX_FILE_SIZE ||
                          !file.sha256.matches("[a-f0-9]{64}")
                      ) {
                          throw new IOException(
                              "Érvénytelen fájladat."
                          );
                      }

                      totalSize += file.size;

                      if (totalSize > MAX_TOTAL_SIZE) {
                          throw new IOException(
                              "Túl nagy frissítés."
                          );
                      }

                      files.put(file.name, file);
                  }

                  return files;
              }

              public File getActiveDirectory() {
                  String active = preferences.getString(
                      "active_directory", ""
                  );

                  if (!active.matches(
                      "[a-f0-9]{64}-[a-f0-9-]{36}"
                  )) {
                      return null;
                  }

                  File directory = new File(root, active);

                  if (!directory.isDirectory()) {
                      return null;
                  }

                  try {
                      JSONObject manifest;

                      try (
                          InputStream input = new FileInputStream(
                              new File(directory, "manifest.json")
                          );

                          ByteArrayOutputStream output =
                              new ByteArrayOutputStream()
                      ) {
                          byte[] buffer = new byte[4096];
                          int count;

                          while ((count = input.read(buffer)) != -1) {
                              output.write(buffer, 0, count);

                              if (output.size() > 65536) {
                                  return null;
                              }
                          }

                          manifest = new JSONObject(
                              output.toString("UTF-8")
                          );
                      }

                      Map<String, ContentFile> files =
                          parseFiles(manifest);

                      for (String name : CONTENT_FILES) {
                          File file = new File(directory, name);
                          ContentFile expected = files.get(name);

                          if (!file.isFile() ||
                              file.length() != expected.size) {
                              return null;
                          }

                          try (
                              InputStream input =
                                  new FileInputStream(file)
                          ) {
                              if (!expected.sha256.equals(
                                  calculateHash(input)
                              )) {
                                  return null;
                              }
                          }
                      }

                      return directory;

                  } catch (Exception e) {
                      return null;
                  }
              }

              private boolean localContentMatches(
                  Map<String, ContentFile> files,
                  File active
              ) {
                  try {
                      for (String name : CONTENT_FILES) {
                          ContentFile expected = files.get(name);

                          InputStream source;

                          if (active != null) {
                              File local = new File(active, name);

                              if (!local.isFile() ||
                                  local.length() != expected.size) {
                                  return false;
                              }

                              source = new FileInputStream(local);

                          } else {
                              source = context.getAssets().open(name);
                          }

                          try (InputStream input = source) {
                              String hash = calculateHash(input);

                              if (!expected.sha256.equals(hash)) {
                                  return false;
                              }
                          }
                      }

                      return true;

                  } catch (Exception e) {
                      return false;
                  }
              }

              private void deleteDirectory(File file) {
                  if (file == null || !file.exists()) {
                      return;
                  }

                  if (file.isDirectory()) {
                      File[] children = file.listFiles();

                      if (children != null) {
                          for (File child : children) {
                              deleteDirectory(child);
                          }
                      }
                  }

                  file.delete();
              }

              private void cleanupOldDirectories(
                  String current,
                  String previous
              ) {
                  File[] directories = root.listFiles();

                  if (directories == null) {
                      return;
                  }

                  for (File directory : directories) {
                      String name = directory.getName();

                      if (!name.equals(current) &&
                          !name.equals(previous)) {
                          deleteDirectory(directory);
                      }
                  }
              }

              public boolean checkForUpdate(
                  Listener listener
              ) throws Exception {

                  JSONObject manifest = readManifest();

                  String version = manifest.getString("version");

                  if (!version.matches("[a-f0-9]{64}")) {
                      throw new IOException(
                          "Érvénytelen tartalomverzió."
                      );
                  }

                  Map<String, ContentFile> files =
                      parseFiles(manifest);

                  File active = getActiveDirectory();

                  // NINCS VÁLTOZÁS: NINCS UPDATING KÉPERNYŐ
                  if (localContentMatches(files, active)) {
                      return false;
                  }

                  long totalSize = 0;

                  for (ContentFile file : files.values()) {
                      totalSize += file.size;
                  }

                  if (!root.exists() && !root.mkdirs()) {
                      throw new IOException(
                          "Nem hozható létre a frissítési mappa."
                      );
                  }

                  if (root.getUsableSpace() <
                      totalSize + 5L * 1024L * 1024L) {

                      throw new IOException(
                          "Nincs elegendő tárhely."
                      );
                  }

                  String uniqueName =
                      version + "-" + UUID.randomUUID().toString();

                  File staging = new File(
                      root,
                      "staging-" + uniqueName
                  );

                  File destination = new File(
                      root,
                      uniqueName
                  );

                  if (!staging.mkdirs()) {
                      throw new IOException(
                          "Nem hozható létre az ideiglenes mappa."
                      );
                  }

                  boolean activated = false;
                  long downloaded = 0;

                  try {
                      listener.onUpdateStarted();
                      listener.onProgress(0);

                      for (String name : CONTENT_FILES) {
                          ContentFile expected = files.get(name);

                          HttpURLConnection connection =
                              openConnection(DOWNLOAD_URL + name);

                          try {
                              if (connection.getResponseCode() != 200) {
                                  throw new IOException(
                                      "Letöltési hiba: " + name
                                  );
                              }

                              MessageDigest digest =
                                  MessageDigest.getInstance("SHA-256");

                              File target = new File(staging, name);

                              long fileDownloaded = 0;

                              try (
                                  InputStream input =
                                      connection.getInputStream();

                                  FileOutputStream output =
                                      new FileOutputStream(target)
                              ) {
                                  byte[] buffer = new byte[16384];
                                  int count;

                                  while (
                                      (count = input.read(buffer)) != -1
                                  ) {
                                      fileDownloaded += count;

                                      if (fileDownloaded > expected.size) {
                                          throw new IOException(
                                              "Hibás fájlméret: " + name
                                          );
                                      }

                                      output.write(buffer, 0, count);
                                      digest.update(buffer, 0, count);

                                      downloaded += count;

                                      int progress = (int) (
                                          downloaded * 100L / totalSize
                                      );

                                      listener.onProgress(
                                          Math.min(99, progress)
                                      );
                                  }

                                  output.flush();
                                  output.getFD().sync();
                              }

                              if (fileDownloaded != expected.size) {
                                  throw new IOException(
                                      "Hiányos fájl: " + name
                                  );
                              }

                              String actualHash =
                                  toHex(digest.digest());

                              if (!expected.sha256.equals(actualHash)) {
                                  throw new IOException(
                                      "SHA-256 ellenőrzési hiba: " + name
                                  );
                              }

                          } finally {
                              connection.disconnect();
                          }
                      }

                      // ELLENŐRZÉS: NEM VÁLTOZOTT-E A SZERVER
                      // A LETÖLTÉS KÖZBEN
                      JSONObject latestManifest = readManifest();

                      if (!version.equals(
                          latestManifest.getString("version")
                      )) {
                          throw new IOException(
                              "A tartalom letöltés közben megváltozott."
                          );
                      }

                      // MANIFEST MENTÉSE
                      try (
                          FileOutputStream output =
                              new FileOutputStream(
                                  new File(staging, "manifest.json")
                              )
                      ) {
                          output.write(
                              manifest.toString().getBytes("UTF-8")
                          );

                          output.flush();
                          output.getFD().sync();
                      }

                      // CSAK A TELJES, ELLENŐRZÖTT FRISSÍTÉS AKTIVÁLHATÓ
                      if (!staging.renameTo(destination)) {
                          throw new IOException(
                              "A frissítés aktiválása sikertelen."
                          );
                      }

                      String previous = preferences.getString(
                          "active_directory", ""
                      );

                      boolean saved = preferences.edit()
                          .putString(
                              "active_directory",
                              uniqueName
                          )
                          .putString(
                              "previous_directory",
                              previous
                          )
                          .putString(
                              "content_version",
                              version
                          )
                          .commit();

                      if (!saved) {
                          throw new IOException(
                              "Nem sikerült menteni a frissítést."
                          );
                      }

                      activated = true;

                      cleanupOldDirectories(
                          uniqueName,
                          previous
                      );

                      listener.onProgress(100);

                      return true;

                  } finally {
                      deleteDirectory(staging);

                      if (!activated) {
                          deleteDirectory(destination);
                      }
                  }
              }
          }
          EOF

          # ANDROID ALKALMAZÁS
          cat > app/src/main/java/com/party/reszegkviz/MainActivity.java <<'EOF'
          package com.party.reszegkviz;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.AnimatorSet;
          import android.animation.ObjectAnimator;
          import android.view.animation.DecelerateInterpolator;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.widget.Toast;
          import android.widget.TextView;
          import android.widget.Button;

          import androidx.core.splashscreen.SplashScreen;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Collections;

          public class MainActivity extends Activity {

              private static final String VERSION_URL =
                  "https://legyen-on-is-reszeg.onrender.com/api/version";

              private static final String GAME_URL =
                  "https://appassets.androidplatform.net/assets/index.html";

              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              private volatile boolean webViewReady = false;
              private volatile boolean destroyed = false;

              private boolean checkingVersion = false;
              private boolean checkingContent = false;
              private boolean updatingContent = false;
              private boolean updateDialogShowing = false;
              private boolean gameLoading = false;
              private boolean waitingForApkUpdate = false;

              private boolean splashLoadingComplete = false;
              private boolean splashFinishScheduled = false;

              private String downloadUrl = "";
              private int latestVersionCode = 0;
              private int minimumVersionCode = 0;
              private String latestVersionName = "";

              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private FrameLayout rootLayout;
              private FrameLayout splashLayout;
              private SplashProgressView splashProgress;
              private TextView splashStatusView;

              private String splashStatus =
                  "Connecting to the server";

              private int splashDots = 0;
              private int splashProgressValue = 0;

              private WebView gameWebView;
              private LiveUpdateManager liveUpdateManager;

              private boolean activityClosed() {
                  return destroyed || isFinishing();
              }

              // ANIMÁLT HÁROM PONT
              private final Runnable splashStatusRunnable =
                  new Runnable() {

                  @Override
                  public void run() {
                      if (splashStatusView != null &&
                          !activityClosed()) {

                          splashDots = (splashDots % 3) + 1;

                          StringBuilder dots =
                              new StringBuilder();

                          for (int i = 0; i < splashDots; i++) {
                              dots.append(".");
                          }

                          splashStatusView.setText(
                              splashStatus + dots.toString()
                          );

                          handler.postDelayed(this, 450);
                      }
                  }
              };

              private void setSplashStatus(String status) {
                  splashStatus = status;
                  splashDots = 0;

                  if (splashStatusView != null) {
                      splashStatusView.setText(status + "...");
                  }

                  handler.removeCallbacks(
                      splashStatusRunnable
                  );

                  handler.postDelayed(
                      splashStatusRunnable, 450
                  );
              }

              // NORMÁL BETÖLTÉSI ANIMÁCIÓ
              private final Runnable splashProgressRunnable =
                  new Runnable() {

                  @Override
                  public void run() {
                      if (
                          splashProgress == null ||
                          activityClosed() ||
                          updatingContent
                      ) {
                          return;
                      }

                      int delay;

                      if (splashProgressValue < 79) {
                          updateSplashProgress(
                              Math.min(
                                  79,
                                  splashProgressValue + 7
                              )
                          );

                          delay = 12;

                      } else if (splashProgressValue < 96) {
                          updateSplashProgress(
                              splashProgressValue + 1
                          );

                          delay = 22;

                      } else if (splashProgressValue < 99) {
                          updateSplashProgress(
                              splashProgressValue + 1
                          );

                          delay =
                              checkingVersion || checkingContent
                              ? 1200
                              : 350;

                      } else if (splashLoadingComplete) {

                          updateSplashProgress(100);

                          if (!splashFinishScheduled) {
                              splashFinishScheduled = true;

                              handler.postDelayed(() -> {
                                  if (!activityClosed() &&
                                      gameWebView != null) {

                                      showGameWithTransition();
                                  }
                              }, 300);
                          }

                          return;

                      } else {
                          delay = 500;
                      }

                      handler.postDelayed(this, delay);
                  }
              };

              // LIVE UPDATE – VALÓDI LETÖLTÉSI SZÁZALÉK
              private void beginLiveUpdate() {
                  if (activityClosed()) return;

                  updatingContent = true;

                  handler.removeCallbacks(
                      splashProgressRunnable
                  );

                  splashProgressValue = 0;

                  if (splashProgress != null) {
                      splashProgress.setProgress(0);
                  }

                  setSplashStatus("Updating");
              }

              private void setLiveUpdateProgress(int progress) {
                  if (activityClosed() || !updatingContent) {
                      return;
                  }

                  splashProgressValue =
                      Math.max(0, Math.min(100, progress));

                  if (splashProgress != null) {
                      splashProgress.setProgress(
                          splashProgressValue
                      );
                  }
              }

              private void finishLiveUpdate(
                  boolean updated
              ) {
                  if (activityClosed()) return;

                  checkingContent = false;

                  if (updated && updatingContent) {
                      setLiveUpdateProgress(100);

                      handler.postDelayed(() -> {
                          if (activityClosed()) return;

                          updatingContent = false;

                          setSplashStatus("Connecting");

                          loadGame();

                      }, 450);

                  } else {
                      updatingContent = false;

                      setSplashStatus("Connecting");

                      handler.removeCallbacks(
                          splashProgressRunnable
                      );

                      handler.post(
                          splashProgressRunnable
                      );

                      loadGame();
                  }
              }

              // FINOM ÁTMENET A JÁTÉKRA
              private void showGameWithTransition() {
                  if (
                      activityClosed() ||
                      gameWebView == null ||
                      splashLayout == null
                  ) {
                      return;
                  }

                  handler.removeCallbacks(
                      splashStatusRunnable
                  );

                  handler.removeCallbacks(
                      splashProgressRunnable
                  );

                  gameWebView.setAlpha(0f);
                  gameWebView.setScaleX(0.985f);
                  gameWebView.setScaleY(0.985f);

                  View splash = splashLayout;

                  gameWebView.setVisibility(View.VISIBLE);

                  enableFullscreen();

                  ObjectAnimator gameFade =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.ALPHA,
                          0f,
                          1f
                      );

                  ObjectAnimator gameScaleX =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.SCALE_X,
                          0.985f,
                          1f
                      );

                  ObjectAnimator gameScaleY =
                      ObjectAnimator.ofFloat(
                          gameWebView,
                          View.SCALE_Y,
                          0.985f,
                          1f
                      );

                  ObjectAnimator splashFade =
                      ObjectAnimator.ofFloat(
                          splash,
                          View.ALPHA,
                          1f,
                          0f
                      );

                  AnimatorSet transition =
                      new AnimatorSet();

                  transition.playTogether(
                      gameFade,
                      gameScaleX,
                      gameScaleY,
                      splashFade
                  );

                  transition.setDuration(450);

                  transition.setInterpolator(
                      new DecelerateInterpolator()
                  );

                  transition.addListener(
                      new AnimatorListenerAdapter() {

                          @Override
                          public void onAnimationEnd(
                              Animator animation
                          ) {
                              if (rootLayout != null) {
                                  rootLayout.removeView(splash);
                              }

                              splashLayout = null;
                              splashProgress = null;
                              splashStatusView = null;
                          }
                      }
                  );

                  transition.start();
              }

              // TELJES KÉPERNYŐS MÓD
              private void enableFullscreen() {
                  Window window = getWindow();

                  window.setStatusBarColor(
                      Color.rgb(8, 13, 25)
                  );

                  window.setNavigationBarColor(
                      Color.rgb(8, 13, 25)
                  );

                  if (android.os.Build.VERSION.SDK_INT >= 30) {

                      WindowInsetsController controller =
                          window.getInsetsController();

                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                              WindowInsetsController
                                  .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );

                          controller.hide(
                              WindowInsets.Type.statusBars() |
                              WindowInsets.Type.navigationBars()
                          );
                      }

                  } else {
                      window.getDecorView()
                          .setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          );
                  }
              }

              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {
                  SplashScreen.installSplashScreen(this);

                  super.onCreate(savedInstanceState);

                  liveUpdateManager =
                      new LiveUpdateManager(
                          this,
                          getInstalledVersionCode()
                      );

                  enableFullscreen();
                  showSplashScreen();
                  checkVersion();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (waitingForApkUpdate) {
                      waitingForApkUpdate = false;
                      checkVersion();
                  }
              }

              @Override
              public void onWindowFocusChanged(
                  boolean hasFocus
              ) {
                  super.onWindowFocusChanged(hasFocus);

                  if (hasFocus) {
                      enableFullscreen();
                  }
              }

              @Override
              protected void onDestroy() {
                  destroyed = true;

                  handler.removeCallbacksAndMessages(null);

                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }

                  if (gameWebView != null) {
                      gameWebView.stopLoading();

                      if (rootLayout != null) {
                          rootLayout.removeView(gameWebView);
                      }

                      gameWebView.destroy();
                      gameWebView = null;
                  }

                  super.onDestroy();
              }


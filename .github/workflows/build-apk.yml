              // JÁTÉK BETÖLTÉSE
              // LIVE UPDATE TARTALOM VAGY EREDETI ASSETS
              private void loadGame() {
                  if (
                      activityClosed() ||
                      gameLoading
                  ) {
                      return;
                  }

                  gameLoading = true;

                  setSplashStatus("Connecting");

                  // A HELYI TARTALOM ELLENŐRZÉSE
                  // HÁTTÉRSZÁLON TÖRTÉNIK
                  new Thread(() -> {
                      File activeDirectory =
                          liveUpdateManager
                              .getActiveDirectory();

                      handler.post(() -> {
                          if (!activityClosed()) {
                              createGameWebView(
                                  activeDirectory
                              );
                          }
                      });

                  }).start();
              }

              private void createGameWebView(
                  File activeDirectory
              ) {
                  try {
                      gameWebView = new WebView(this);

                      WebSettings settings =
                          gameWebView.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      WebViewAssetLoader.AssetsPathHandler
                          bundledAssets =
                              new WebViewAssetLoader
                                  .AssetsPathHandler(this);

                      // AZ EREDETI WEBVIEW URL MEGMARAD,
                      // ÍGY A LOCALSTORAGE SEM VÁLTOZIK
                      WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                              .addPathHandler(
                                  "/assets/",
                                  path -> {

                                      boolean allowed =
                                          "index.html".equals(path) ||
                                          "easy.json".equals(path) ||
                                          "normal.json".equals(path) ||
                                          "hard.json".equals(path);

                                      if (allowed &&
                                          activeDirectory != null) {

                                          try {
                                              File file = new File(
                                                  activeDirectory,
                                                  path
                                              );

                                              if (!file.isFile()) {
                                                  throw new Exception(
                                                      "Hiányzó fájl."
                                                  );
                                              }

                                              String mimeType =
                                                  path.endsWith(".html")
                                                  ? "text/html"
                                                  : "application/json";

                                              return new WebResourceResponse(
                                                  mimeType,
                                                  "UTF-8",
                                                  200,
                                                  "OK",
                                                  Collections.singletonMap(
                                                      "Cache-Control",
                                                      "no-store"
                                                  ),
                                                  new FileInputStream(file)
                                              );

                                          } catch (Exception e) {
                                              return new WebResourceResponse(
                                                  "text/plain",
                                                  "UTF-8",
                                                  500,
                                                  "Content Error",
                                                  Collections.emptyMap(),
                                                  new java.io.ByteArrayInputStream(
                                                      new byte[0]
                                                  )
                                              );
                                          }
                                      }

                                      return bundledAssets.handle(path);
                                  }
                              )
                              .build();

                      gameWebView.setWebViewClient(
                          new WebViewClientCompat() {

                              @Override
                              public WebResourceResponse
                                  shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request
                                  ) {

                                  // A TAILWIND CDN HELYI PÉLDÁNYA.
                                  // A HTML változatlanul a CDN URL-t használja,
                                  // de az APK a beépített fájlt adja vissza,
                                  // ezért offline módban sem esik szét a felület.
                                  if (
                                      "cdn.tailwindcss.com".equals(
                                          request.getUrl().getHost()
                                      )
                                  ) {
                                      try {
                                          return new WebResourceResponse(
                                              "application/javascript",
                                              "UTF-8",
                                              MainActivity.this
                                                  .getAssets()
                                                  .open("tailwindcss.js")
                                          );
                                      } catch (Exception e) {
                                          android.util.Log.e(
                                              "OfflineAssets",
                                              "A helyi Tailwind nem tölthető be.",
                                              e
                                          );
                                          return new WebResourceResponse(
                                              "text/plain",
                                              "UTF-8",
                                              new java.io.ByteArrayInputStream(
                                                  new byte[0]
                                              )
                                          );
                                      }
                                  }

                                  return assetLoader
                                      .shouldInterceptRequest(
                                          request.getUrl()
                                      );
                              }

                              @Override
                              public void onPageFinished(
                                  WebView view,
                                  String url
                              ) {
                                  super.onPageFinished(view, url);

                                  if (
                                      webViewReady ||
                                      activityClosed() ||
                                      !GAME_URL.equals(url)
                                  ) {
                                      return;
                                  }

                                  webViewReady = true;

                                  splashLoadingComplete = true;

                                  handler.removeCallbacks(
                                      splashProgressRunnable
                                  );

                                  handler.post(
                                      splashProgressRunnable
                                  );
                              }
                          }
                      );

                      gameWebView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public void onProgressChanged(
                                  WebView view,
                                  int newProgress
                              ) {
                                  // A BETÖLTÉSI SZÁZALÉKOT
                                  // A SAJÁT RENDSZER KEZELI.
                              }

                              @Override
                              public boolean onShowFileChooser(
                                  WebView webView,
                                  ValueCallback<Uri[]> callback,
                                  FileChooserParams params
                              ) {
                                  if (filePathCallback != null) {
                                      filePathCallback
                                          .onReceiveValue(null);
                                  }

                                  filePathCallback = callback;

                                  try {
                                      Intent intent =
                                          params.createIntent();

                                      startActivityForResult(
                                          intent,
                                          FILE_CHOOSER_REQUEST_CODE
                                      );

                                  } catch (Exception e) {
                                      filePathCallback
                                          .onReceiveValue(null);

                                      filePathCallback = null;

                                      return false;
                                  }

                                  return true;
                              }
                          }
                      );

                      // WEBVIEW A SPLASH KÉPERNYŐ ALATT
                      gameWebView.setAlpha(0f);

                      rootLayout.addView(
                          gameWebView,
                          0,
                          new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT
                          )
                      );

                      // CSAK A WEBVIEW HTTP CACHE TÖRLÉSE.
                      // LOCALSTORAGE ÉS LICENCADATOK MEGMARADNAK.
                      gameWebView.clearCache(true);

                      gameWebView.loadUrl(GAME_URL);

                  } catch (Exception e) {
                      gameLoading = false;

                      if (gameWebView != null) {
                          rootLayout.removeView(gameWebView);
                          gameWebView.destroy();
                          gameWebView = null;
                      }

                      Toast.makeText(
                          this,
                          "A játék betöltése nem sikerült.",
                          Toast.LENGTH_LONG
                      ).show();

                      new AlertDialog.Builder(this)
                          .setTitle("Betöltési hiba")
                          .setMessage(
                              "Nem sikerült elindítani a játékot."
                          )
                          .setPositiveButton(
                              "ÚJRA",
                              (dialog, which) -> loadGame()
                          )
                          .setNegativeButton(
                              "KILÉPÉS",
                              (dialog, which) -> finish()
                          )
                          .setCancelable(false)
                          .show();
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      requestCode ==
                      FILE_CHOOSER_REQUEST_CODE
                  ) {
                      if (filePathCallback == null) {
                          return;
                      }

                      Uri[] results = null;

                      if (
                          resultCode == RESULT_OK &&
                          data != null
                      ) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      filePathCallback
                          .onReceiveValue(results);

                      filePathCallback = null;
                  }
              }
          }
          EOF

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.p12

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reszeg-Kviz-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

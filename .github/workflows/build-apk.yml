
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'easy.json'
      - 'normal.json'
      - 'hard.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/party/reszegkviz

          cp index.html app/src/main/assets/index.html
          cp easy.json app/src/main/assets/easy.json
          cp normal.json app/src/main/assets/normal.json
          cp hard.json app/src/main/assets/hard.json

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReszegKviz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.party.reszegkviz'
              compileSdk 35

              signingConfigs {
                  release {
                      storeFile file("release-key.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'com.party.reszegkviz'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Legyen Ön is Részeg"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/party/reszegkviz/MainActivity.java <<'EOF'
          package com.party.reszegkviz;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;

          public class MainActivity extends Activity {

              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST_CODE
                              );
                          } catch (Exception e) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback == null) return;

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }
          }
          EOF

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.p12

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reszeg-Kviz-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
